<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#1f4fbf"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#dc5b16"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#08725d"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #123e9c; }
      .section { font: 700 24px Arial, sans-serif; fill: #123e9c; }
      .heading { font: 700 20px Arial, sans-serif; }
      .body { font: 16px Arial, sans-serif; }
      .small { font: 14px Arial, sans-serif; }
      .bluebox { fill: #f4f7ff; stroke: #1f4fbf; stroke-width: 2; }
      .greenbox { fill: #f2fbf8; stroke: #08725d; stroke-width: 2; }
      .orangebox { fill: #fff7ef; stroke: #dc5b16; stroke-width: 2; }
      .graybox { fill: #fafafa; stroke: #777; stroke-width: 2; }
      .line-blue { stroke: #1f4fbf; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .line-orange { stroke: #dc5b16; stroke-width: 2.5; fill: none; marker-end: url(#arrow-orange); }
      .line-green { stroke: #08725d; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1400" height="1080" fill="white"/>
  <rect x="10" y="10" width="1380" height="1060" rx="16" fill="none" stroke="#9fb8ed" stroke-width="2"/>
  <text x="700" y="45" text-anchor="middle" class="title">Hierarchical Long-Horizon Robot Learning Framework</text>
  <line x1="20" y1="65" x2="1380" y2="65" stroke="#9fb8ed" stroke-width="2"/>
  <text x="700" y="98" text-anchor="middle" class="section">High-level Semantic Planning</text>

  <rect x="35" y="120" width="230" height="330" rx="12" class="bluebox"/>
  <text x="150" y="150" text-anchor="middle" class="heading" fill="#123e9c">Task and Observations</text>
  <rect x="55" y="170" width="190" height="72" rx="8" class="graybox"/>
  <text x="150" y="198" text-anchor="middle" class="body">Global task</text>
  <text x="150" y="222" text-anchor="middle" class="small">instruction / goal</text>
  <rect x="55" y="258" width="190" height="80" rx="8" class="graybox"/>
  <text x="150" y="288" text-anchor="middle" class="body">Current observations</text>
  <text x="150" y="312" text-anchor="middle" class="small">front + wrist cameras</text>
  <rect x="55" y="354" width="190" height="76" rx="8" class="graybox"/>
  <text x="150" y="383" text-anchor="middle" class="body">Task memory</text>
  <text x="150" y="407" text-anchor="middle" class="small">completed subtasks / result</text>

  <rect x="325" y="135" width="295" height="205" rx="14" class="bluebox"/>
  <text x="472" y="174" text-anchor="middle" class="heading" fill="#123e9c">VLM Planner</text>
  <text x="472" y="202" text-anchor="middle" class="body">Qwen3-VL + LoRA</text>
  <line x1="350" y1="216" x2="595" y2="216" stroke="#9fb8ed"/>
  <text x="472" y="244" text-anchor="middle" class="body">(G, O<tspan baseline-shift="sub">t</tspan>, H<tspan baseline-shift="sub">t</tspan>, z<tspan baseline-shift="sub">t-1</tspan>, r<tspan baseline-shift="sub">t-1</tspan>) -&gt; z<tspan baseline-shift="sub">t</tspan></text>
  <text x="472" y="276" text-anchor="middle" class="body">Output: mode, instruction,</text>
  <text x="472" y="300" text-anchor="middle" class="body">atomic_skill, stage</text>
  <text x="472" y="326" text-anchor="middle" class="small" fill="#123e9c">event-triggered replanning</text>

  <rect x="690" y="145" width="270" height="130" rx="12" class="greenbox"/>
  <text x="825" y="177" text-anchor="middle" class="heading" fill="#08725d">Subtask JSON</text>
  <text x="725" y="207" class="body">{ mode: execute,</text>
  <text x="725" y="231" class="body">  instruction: ...,</text>
  <text x="725" y="255" class="body">  atomic_skill: ..., stage: ... }</text>

  <rect x="1000" y="145" width="285" height="130" rx="12" class="greenbox"/>
  <text x="1142" y="179" text-anchor="middle" class="heading" fill="#08725d">Template Renderer</text>
  <text x="1142" y="212" text-anchor="middle" class="body">global task + current subtask</text>
  <text x="1142" y="238" text-anchor="middle" class="body">-&gt; normalized VLA prompt</text>

  <path d="M265 275 H325" class="line-blue"/>
  <path d="M620 225 H690" class="line-blue"/>
  <path d="M960 210 H1000" class="line-green"/>

  <rect x="390" y="365" width="790" height="180" rx="14" class="orangebox"/>
  <text x="785" y="397" text-anchor="middle" class="heading" fill="#dc5b16">Status Branch from pi0.5 VLA Prefix</text>
  <text x="415" y="434" class="small">VLA prefix hidden tokens [B, M, 2048]</text>
  <path d="M610 425 H665" class="line-orange"/>
  <rect x="665" y="410" width="95" height="45" rx="6" fill="#fff" stroke="#dc5b16"/>
  <text x="712" y="438" text-anchor="middle" class="small">2048 -&gt; 512</text>
  <path d="M760 432 H805" class="line-orange"/>
  <rect x="805" y="410" width="90" height="45" rx="6" fill="#fff" stroke="#dc5b16"/>
  <text x="850" y="438" text-anchor="middle" class="small">[STATUS]</text>
  <path d="M895 432 H940" class="line-orange"/>
  <rect x="940" y="410" width="120" height="45" rx="6" fill="#fff" stroke="#dc5b16"/>
  <text x="1000" y="438" text-anchor="middle" class="small">2-layer Transformer</text>
  <path d="M1060 432 H1100" class="line-orange"/>
  <rect x="1100" y="410" width="60" height="45" rx="6" fill="#fff" stroke="#dc5b16"/>
  <text x="1130" y="438" text-anchor="middle" class="small">z</text>
  <text x="785" y="492" text-anchor="middle" class="body">z_status [B, 512] -&gt; Done Head -&gt; running / done / failure / timeout</text>
  <text x="785" y="520" text-anchor="middle" class="small">The branch uses prefix hidden tokens and is jointly trained with the VLA.</text>
  <path d="M472 340 V365" class="line-orange"/>
  <path d="M1142 275 V330 H1120 V365" class="line-green"/>

  <line x1="20" y1="575" x2="1380" y2="575" stroke="#9fb8ed" stroke-width="2"/>
  <text x="700" y="610" text-anchor="middle" class="section">Low-level Control and Execution</text>

  <rect x="55" y="660" width="285" height="190" rx="14" class="greenbox"/>
  <text x="197" y="700" text-anchor="middle" class="heading" fill="#08725d">Cosmos Policy / WAM</text>
  <text x="197" y="728" text-anchor="middle" class="body">frozen future vision and action prior</text>
  <line x1="80" y1="744" x2="315" y2="744" stroke="#acd9cc"/>
  <text x="197" y="775" text-anchor="middle" class="small">current observation + subtask + state</text>
  <text x="197" y="801" text-anchor="middle" class="small">-&gt; future vision latent</text>
  <text x="197" y="827" text-anchor="middle" class="small">-&gt; anticipated action prior</text>

  <rect x="420" y="660" width="230" height="80" rx="12" class="orangebox"/>
  <text x="535" y="692" text-anchor="middle" class="heading" fill="#dc5b16">Dynamic Encoder</text>
  <text x="535" y="718" text-anchor="middle" class="small">latent steering</text>
  <rect x="420" y="770" width="230" height="80" rx="12" class="orangebox"/>
  <text x="535" y="802" text-anchor="middle" class="heading" fill="#dc5b16">Action Encoder</text>
  <text x="535" y="828" text-anchor="middle" class="small">action prior token</text>

  <rect x="745" y="640" width="355" height="245" rx="14" class="bluebox"/>
  <text x="922" y="680" text-anchor="middle" class="heading" fill="#123e9c">Low-level VLA Executor</text>
  <text x="922" y="708" text-anchor="middle" class="body">OpenPI pi0.5 + vision/action steering</text>
  <text x="770" y="748" class="small">Inputs:</text>
  <text x="785" y="773" class="small">current observations, robot state</text>
  <text x="785" y="797" class="small">global task + current subtask</text>
  <text x="785" y="821" class="small">future vision latent + action prior</text>
  <line x1="770" y1="840" x2="1075" y2="840" stroke="#9fb8ed"/>
  <text x="922" y="865" text-anchor="middle" class="body">Output: action chunk [K, action_dim]</text>

  <rect x="1180" y="675" width="160" height="150" rx="14" class="graybox"/>
  <text x="1260" y="710" text-anchor="middle" class="heading">Robot /</text>
  <text x="1260" y="737" text-anchor="middle" class="heading">Environment</text>
  <text x="1260" y="778" text-anchor="middle" class="small">execute action chunk</text>
  <text x="1260" y="802" text-anchor="middle" class="small">return observation</text>

  <path d="M340 730 H420" class="line-orange"/>
  <path d="M340 810 H420" class="line-orange"/>
  <path d="M650 700 H745" class="line-orange"/>
  <path d="M650 810 H745" class="line-orange"/>
  <path d="M1100 760 H1180" class="line-blue"/>
  <path d="M1260 675 V590 H1140 V545" class="line-blue"/>
  <path d="M1180 860 H370 V850" class="line-green dashed"/>

  <rect x="40" y="930" width="1320" height="105" rx="12" class="graybox"/>
  <text x="700" y="960" text-anchor="middle" class="heading">Training supervision</text>
  <text x="230" y="995" text-anchor="middle" class="small">Planner: global task + observation + history -&gt; next subtask</text>
  <text x="700" y="995" text-anchor="middle" class="small">Status: VLA prefix + subtask -&gt; completion state</text>
  <text x="1140" y="995" text-anchor="middle" class="small">Executor: observation + WAM latents + prior -&gt; action</text>
</svg>
