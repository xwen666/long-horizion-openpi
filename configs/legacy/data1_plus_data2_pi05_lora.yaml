version: 1
name: data1_plus_data2_pi05_lora
base_config_name: pi05_grasp_200_standard_lora

notes:
  - "This reuses the current standard grasp LoRA recipe on the local data1_plus_data2 dataset."
  - "The dataset metadata matches the local grasp format: 7D state/action, front+wrist images, prompt_from_task=true."
  - "The original /cc/openpi/data1_plus_data2 uses a LeRobot v3 chunk/file layout that the current local split loader cannot read directly."
  - "Use /cc/openpi/grasp_200 as the v2.1-compatible mirror of the same sampled episode set for training IO, while keeping repo_id=data1_plus_data2 for assets/checkpoints."
  - "Create a fresh split and norm stats before training."

paths:
  dataset_root: /cc/openpi/grasp_200
  splits_path: /cc/openpi/data1_plus_data2_splits/splits.json
  base_checkpoint_params: /cc/openpi/openpi-assets/checkpoints/pi05_base/params
  assets_base_dir: /cc/openpi/assets
  norm_stats_assets_dir: /cc/openpi/assets/pi05_grasp
  norm_stats_asset_id: data1_plus_data2
  checkpoint_base_dir: /cc/openpi/checkpoints

dataset:
  repo_id: data1_plus_data2
  train_split: train
  eval_split: test
  prompt_from_task: true
  use_delta_joint_actions: true
  action_dim: 7

model:
  type: pi05
  pi05: true
  action_dim: 7
  action_horizon: 20
  discrete_state_input: false
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora_alpha64
  trainable_parameters: lora_params_plus_non_llm_heads

training:
  exp_name: pi05_data1_plus_data2_lora
  seed: 42
  batch_size: 32
  num_workers: 2
  num_train_steps: 20000
  log_interval: 20
  save_interval: 1000
  eval_interval: 1000
  eval_num_batches: 16
  eval_use_ema: true
  keep_period: 5000
  ema_decay: null
  overwrite: true
  resume: false
  wandb_enabled: false
  fsdp_devices: 1

optimizer:
  name: adamw
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

lr_schedule:
  name: cosine_decay
  warmup_steps: 1000
  peak_lr: 4.0e-5
  decay_steps: 20000
  decay_lr: 1.0e-5

env:
  OPENPI_DATA_HOME: /cc/openpi
  XLA_PYTHON_CLIENT_MEM_FRACTION: 0.90
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

commands:
  create_split: |-
    uv run python create_grasp_split.py \
      --dataset-root /cc/openpi/grasp_200 \
      --output-dir /cc/openpi/data1_plus_data2_splits \
      --test-episodes 20 \
      --seed 20260611

  compute_norm_stats: |-
    OPENPI_GRASP_REPO_ID=data1_plus_data2 \
    OPENPI_GRASP_DATASET_ROOT=/cc/openpi/grasp_200 \
    OPENPI_GRASP_SPLITS_PATH=/cc/openpi/data1_plus_data2_splits/splits.json \
    OPENPI_DATA_HOME=/cc/openpi \
    uv run python scripts/compute_norm_stats.py --config-name pi05_grasp_200_standard_lora

  train: |-
    OPENPI_GRASP_REPO_ID=data1_plus_data2 \
    OPENPI_GRASP_DATASET_ROOT=/cc/openpi/grasp_200 \
    OPENPI_GRASP_SPLITS_PATH=/cc/openpi/data1_plus_data2_splits/splits.json \
    OPENPI_DATA_HOME=/cc/openpi \
    XLA_PYTHON_CLIENT_MEM_FRACTION=0.90 \
    XLA_PYTHON_CLIENT_PREALLOCATE=false \
    uv run python scripts/train.py pi05_grasp_200_standard_lora \
      --exp-name pi05_data1_plus_data2_lora \
      --data.repo-id data1_plus_data2 \
      --data.root /cc/openpi/grasp_200 \
      --data.splits-path /cc/openpi/data1_plus_data2_splits/splits.json \
      --data.assets.assets-dir /cc/openpi/assets/pi05_grasp \
      --data.assets.asset-id data1_plus_data2 \
      --weight-loader.params-path /cc/openpi/openpi-assets/checkpoints/pi05_base/params \
      --batch-size 32 \
      --num-workers 2 \
      --num-train-steps 20000 \
      --lr-schedule.peak-lr 4e-5 \
      --lr-schedule.decay-steps 20000 \
      --save-interval 1000 \
      --eval-interval 1000 \
      --eval-num-batches 16 \
      --checkpoint-base-dir /cc/openpi/checkpoints \
      --overwrite \
      --no-wandb-enabled

  resume: |-
    OPENPI_GRASP_REPO_ID=data1_plus_data2 \
    OPENPI_GRASP_DATASET_ROOT=/cc/openpi/grasp_200 \
    OPENPI_GRASP_SPLITS_PATH=/cc/openpi/data1_plus_data2_splits/splits.json \
    OPENPI_DATA_HOME=/cc/openpi \
    XLA_PYTHON_CLIENT_MEM_FRACTION=0.90 \
    XLA_PYTHON_CLIENT_PREALLOCATE=false \
    uv run python scripts/train.py pi05_grasp_200_standard_lora \
      --exp-name pi05_data1_plus_data2_lora \
      --data.repo-id data1_plus_data2 \
      --data.root /cc/openpi/grasp_200 \
      --data.splits-path /cc/openpi/data1_plus_data2_splits/splits.json \
      --data.assets.assets-dir /cc/openpi/assets/pi05_grasp \
      --data.assets.asset-id data1_plus_data2 \
      --weight-loader.params-path /cc/openpi/openpi-assets/checkpoints/pi05_base/params \
      --batch-size 32 \
      --num-workers 2 \
      --num-train-steps 20000 \
      --lr-schedule.peak-lr 4e-5 \
      --lr-schedule.decay-steps 20000 \
      --save-interval 1000 \
      --eval-interval 1000 \
      --eval-num-batches 16 \
      --checkpoint-base-dir /cc/openpi/checkpoints \
      --resume \
      --no-wandb-enabled
